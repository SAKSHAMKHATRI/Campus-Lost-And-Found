<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Login to Campus Lost & Found — report and find lost items around campus."
  />
  <title>Login — Campus Lost & Found</title>

  <link
    rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231d4ed8'/><circle cx='27' cy='27' r='11' fill='none' stroke='white' stroke-width='5'/><path d='M35.5 35.5 46 46' stroke='white' stroke-width='5' stroke-linecap='round'/></svg>"
  />

  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="auth-page">

  <nav class="navbar" aria-label="Main campus navigation">
    <div class="navbar-inner">

      <a class="nav-brand" href="index.html" aria-label="Campus Lost and Found home">
        <span class="brand-icon small" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="7" />
            <path d="m21 21-4.3-4.3" />
          </svg>
        </span>

        <span class="brand-name">
          Campus <span class="brand-accent">Lost &amp; Found</span>
        </span>
      </a>

      <a class="btn btn-small btn-outline" href="signup.html">
        Create an account
      </a>

    </div>
  </nav>

  <main class="auth-layout">

    <section class="auth-card-wrap" aria-labelledby="loginHeading">

      <div class="auth-card">

        <div class="brand">

          <div class="brand-icon" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="7" />
              <path d="m21 21-4.3-4.3" />
            </svg>
          </div>

          <h1 id="loginHeading">Welcome back</h1>
          <p>Login to continue to your dashboard</p>

        </div>

        <div
          id="loginAlert"
          class="alert"
          role="alert"
          aria-live="polite"
          aria-atomic="true"
        ></div>

        <form
          id="loginForm"
          onsubmit="handleLogin(event)"
          novalidate
          aria-describedby="loginAlert"
        >

          <div class="form-group">

            <label for="email">Email</label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="e.g. rahul@college.edu"
              autocomplete="email"
              inputmode="email"
              required
              aria-required="true"
            />

          </div>

          <div class="form-group">

            <label for="password">Password</label>

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Your password"
              autocomplete="current-password"
              required
              aria-required="true"
            />

          </div>

          <button type="submit" class="btn">
            Login
          </button>

        </form>

        <p class="auth-footer">
          New here?
          <a href="signup.html">Create an account</a>
        </p>

      </div>

    </section>

  </main>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>

  <script>
    showSignupSuccess();

    if (getCurrentUser()) {
      window.location.href = 'dashboard.html';
    }
  </script>

</body>

</html>
